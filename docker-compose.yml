services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_pass
      POSTGRES_DB: clinic_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: always
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: "postgresql+asyncpg://clinic_user:clinic_pass@db:5432/clinic_db"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      REDIS_PUBSUB_URL: "redis://redis:6379/2"
    restart: unless-stopped

volumes:
  postgres_data: